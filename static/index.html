<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise AI Agent</title><style>body{font-family:system-ui;max-width:900px;margin:50px auto;padding:20px}input{width:70%;padding:12px}button{padding:12px}pre{background:#f5f5f5;padding:16px;border-radius:10px;white-space:pre-wrap}</style></head><body><h1>Enterprise AI Data Intelligence Agent</h1><p>Conversational analytics + ML inference through controlled backend tools.</p><input id="q" value="Show sales by region"><button onclick="ask()">Ask Agent</button><pre id="out">Ready.</pre><script>async function ask(){const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.getElementById('q').value})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
